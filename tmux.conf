################################################################################
#  COMPLIANT-VIM  |  tmux.conf  |  OFFLINE  |  NO PLUGINS (no TPM)
#
#  Paste into ~/.tmux.conf.  Settings only: colors, key bindings, scrollback.
#  - NO network, NO run-shell, NO plugins, NO external commands are invoked.
#  - Clipboard stays INSIDE tmux (set-clipboard off): programs cannot write to
#    your system clipboard via escape codes, which is the safer default.
#  - Colors only change how this tmux draws its own status bar and borders.
################################################################################

# ---- basics ----------------------------------------------------------------
set -g default-terminal "screen-256color"     # tmux-256color terminfo is missing on stock RHEL (needs ncurses-term)
set -ga terminal-overrides ",*256col*:Tc"     # truecolor passthrough (for vim themes)
set -ga update-environment " COLORTERM"       # refresh COLORTERM on each attach, so a stale value from
                                              # another terminal can't turn on truecolor vim can't draw
set -g history-limit 50000
set -g escape-time 10                         # snappy <Esc> in vim
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on                               # click panes/tabs, drag borders, wheel scroll
set -g focus-events on
set -g set-clipboard off
set -g allow-passthrough off
setw -g mode-keys vi

# ---- NEW TAB / SPLIT KEEPS YOUR DIRECTORY (the one you asked for) ----------
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---- movement (vim style) --------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Tab last-window                          # prefix Tab = flip to previous tab

# ---- copy mode: v to select, y to copy (into tmux's own buffer) ------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---- builds: a long job finishing in another tab lights that tab up --------
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# ---- look (default = 'night'; the shell's `theme` command changes these live)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bold] #S #[nobold]| "
set -g status-right " #{b:pane_current_path} | %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=colour111,fg=colour16,bold"
setw -g window-status-bell-style "bg=colour203,fg=colour16,bold"
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour111"
set -g message-style "bg=colour111,fg=colour16,bold"
